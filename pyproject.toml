[project]
name = "adb-qr"
version = "0.1.0"
description = "The missing `adb pair --qr`: pair Android wireless debugging by scanning a QR code in your terminal. Works everywhere adb does, even WSL2."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["qrcode>=7"]
authors = [{ name = "Aleix", email = "aleixrodriala@gmail.com" }]
keywords = ["adb", "android", "wireless-debugging", "qr-code", "wsl2", "mdns"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/aleixrodriala/adb-qr"
Issues = "https://github.com/aleixrodriala/adb-qr/issues"

[project.scripts]
adb-qr = "adb_qr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["adb_qr.py"]
